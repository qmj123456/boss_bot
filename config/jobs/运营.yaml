recruitment:
  # 招聘岗位：京东/天猫运营
  job_name: "运营"
  # 打招呼后发送的后续话术（优先级高于 config/message.yaml）
  greet_message: |
    哈喽，我们在招京东 / 天猫运营。产品为高客单价手机壳。
    公司主要在京东、天猫和抖音深耕，各平台店铺均排名在同类目前十！
    盈利稳定增长！薪资能满足你的期望！入职上社保！大小周！
    我们的优势是：
    1、产品沉淀小十年时间，产品质量和供应链稳定，为精细化运营提供可靠基石。
    2、重视运营话语权，行业内专业的客服、视觉团队独立支持。
    3、团队氛围活跃简单。
    4、不限 AI 资源赋能工作。
    可以发份简历给你详细介绍下我们岗位情况哈！
  boss_display_name: ${BOSS_JOB_NAME_OPERATION}
  boss_match_names:
    - "国内电商运营（精品/3C品类）"

  experience_required: "完整简历筛选要求：至少有一段工作经历的公司名称命中竞品公司名单（全称或简称均可），该段经历的岗位名称必须命中京东运营、天猫运营或运营，并在职满8个月以上，且结束/离职时间距今不超过3年；明确写‘至今’视为满足。不满足直接淘汰。最近一份工作的岗位名称或描述包含京东、天猫、快车、自营、VC、POP、直通车、万相台或引力魔方任一关键词。"

  degree_required: "不筛学历。"

  skill_requirements:
    - work_experience 中必须至少有一段 company 命中竞品公司名单（全称或简称），否则直接淘汰
    - 命中竞品的同一段经历岗位名称必须命中京东运营、天猫运营或运营
    - 命中竞品的同一段经历需在职满8个月以上
    - 命中竞品的同一段经历结束/离职时间距今不超过3年；明确写“至今”视为满足
    - 最近一份工作的岗位名称或描述包含京东、天猫、快车、自营、VC、POP、直通车、万相台或引力魔方任一关键词

  additional_requirements: |
    【完整简历必须全部满足】
    - 最近3份工作中至少一段连续满8个月。
    - 至少有一段工作经历同时满足：公司命中竞品名单、岗位名称命中京东运营/天猫运营/运营、在职满8个月以上、结束/离职时间距今不超过3年；明确写“至今”视为满足。
    - 最近一份工作的岗位名称或描述包含以下任一关键词：京东、天猫、快车、自营、VC、POP、直通车、万相台、引力魔方。

    【不再筛选】
    - 学历
    - 当前所在地
    - 求职状态
    - 是否独立全店操盘
    - 是否有量化经营成果
    - AI应用能力

    【去重、执行与停止】
    - 卡片通过后立即查看完整简历；完整简历通过并完成去重后立即打招呼。
    - 若目标未完成，需要累计检查至少500名不重复候选人才能正常结束。
    - 遇到验证码、登录失效、额度、风控或平台确实没有更多候选人，须异常停止并明确汇报。
    - 只有获得当轮明确授权才能联系候选人；绝不自动点“不合适”。

  # 完整简历分析：求职状态仅从在线简历截图读取，不在卡片阶段判断。
  resume_analysis:
    employment_status_whitelist: []

  # 卡片预筛：只做卡片可见硬条件判断，不做评分。
  card_prescreen:
    require_work_experience: true
    enabled: true
    active_status_keywords: ["刚刚活跃", "在线"]
    max_age: 33
    city_keyword: 深圳
    role_keywords: ["京东", "天猫", "运营"]
    role_exclude_keywords: ["跨境", "亚马逊", "用户", "产品"]
    # 竞品公司卡片预筛：geekWorks 中的 company 需命中其一
    # 且命中竞品公司的经历岗位名需包含京东运营/天猫运营/运营之一
    # 且命中竞品公司的经历工作月数需≥8个月、结束时间距今不超过3年
    competitor_position_keywords: ["京东运营", "天猫运营", "运营"]
    competitor_position_exclude_keywords: ["亚马逊", "用户", "产品", "新媒体"]
    competitor_min_months: 8
