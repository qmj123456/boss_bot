recruitment:
  # 招聘岗位名称，会进入 AI 硬性条件判断输入，也会写入数据库和飞书表格。
  # 示例：Python后端开发工程师 / Java开发工程师 / AI应用工程师
  job_name: "全职主播"
  # 打招呼后发送的后续话术（优先级高于 config/message.yaml）
  greet_message: |
    您好，我们正在招聘主播。播品为3C保护壳类。
    店铺排名前三！主播抖音平台！纯付费！
    有成熟的主播晋升运营的机制！
    直播间日销700单左右，客单价150元。数据超级好！
    月休6天！直播间盈利稳定，每月稳定高提成。入职上社保。
    无责底薪10k左右+最高提GMV3%提成，月均主播提成2000-1w。
    每周1次下午茶活动，节假日福利多多，团队氛围超级棒！
    方便发下简历和切片，给您介绍下我们岗位吗？
  # BOSS 推荐页下拉框里的可见岗位标题；BOSS 标题变更时只改这里。
  boss_display_name: ${BOSS_JOB_NAME_FULLTIME_ANCHOR}
  boss_match_names:
    - " 抖音主播（成熟账号/往直播运营方向发展）"

  # 期望工作经验，用自然语言填写即可，AI 会结合简历做匹配判断。
  # 示例：3年以上后端开发经验，有招聘系统、CRM、自动化工具经验优先
  experience_required: "毕业至今至少有一段工作满7个月；最近实际岗位必须是主播、带货主播、抖音主播或电商主播。若最近岗位是直播运营，必须明确写本人出镜、主讲、讲品或带货成交。"

  # 最低学历要求。建议写清楚“硬性要求”还是“优先项”，避免 AI 误杀候选人。
  # 示例：本科及以上，计算机相关专业优先；优秀候选人可放宽到大专
  degree_required: "高中及以上。"

  # 核心技能要求。按列表逐条填写，越具体 AI 判断越稳定。
  # 示例：
  #   - Python
  #   - FastAPI 或 Flask
  #   - SQLAlchemy
  #   - SQLite/MySQL
  #   - 自动化脚本或浏览器自动化经验
  skill_requirements:
    - 最近实际岗位为主播、带货主播、抖音主播或电商主播
    - 最近岗位为直播运营时，必须明确本人出镜、主讲、讲品或带货成交
    - 最近两份工作内至少一段主播经历有明确成果；成果可为带数字的经营指标、主播岗位内的排名/晋升/带教成果，或明确的粉丝增长、复购、成交件数等结果

  # 其他补充要求。适合放业务背景、加分项、排除项、沟通偏好等长文本。
  # 示例：有 BOSS 直聘、飞书、企业微信、CRM 对接经验加分；频繁跳槽需谨慎。
  additional_requirements: |
    【完整简历必须全部满足】
    - 毕业至今至少有一段工作满7个月。
    - 最近实际岗位必须是主播、带货主播、抖音主播或电商主播。
    - 若最近岗位为直播运营，必须明确写本人出镜、主讲、讲品或带货成交。
    - 纯运营、短视频、销售、商务BD、客服、场控、中控、助播、运营助理不通过。
    - 最近两份工作内，至少一段主播经历有明确成果；成果必须与该段主播经历绑定，不能借用短视频、运营或其他岗位的业绩。

    【有效成果口径】
    - 带数字的 GMV、GSV、ROI、销售额、成交额、月销、日销、订单量或转化率。
    - 主播岗位内的销冠、第一、前三、排名、晋升、培训新主播或带新人。
    - 明确的粉丝增长、复购、成交件数等结果。

    【直接排除】
    - "最近一份工作"指简历中时间最近的一段工作经历；排除项只在最近一份工作的主营业务/主营品类上判断，历史经历或过往项目中提到这些品类不算命中。
    - "涉及 X"指最近一份工作的主营品类/平台/模式为 X，不是简历全文出现 X 这个词。
    - 例：最近一份工作是带货主播主营服装，即使更早经历提过"曾帮朋友卖过平板"，不命中"最近一份工作涉及平板"的排除项。
    - 最近一份工作的主营业务为随身WIFI、笔记本电脑、平板、台式电脑、监控、汽车或手机主销；手机壳不排除。
    - 最近一份工作的主营业务为留资、旅游线路、旅游套餐、旅游团购、本地生活、娱乐主播、才艺值或团购。
    - 最近7个月明确在小红书、TikTok、京东、淘宝、天猫、得物、视频号、快手、唯品会等平替平台做直播/带货经历；普通运营协作、内容发布或泛泛写平台完成工作不自动触发。
    - 最近两份工作职责/业绩描述出现中文词“英文”或“美金”；证书、语言能力、技能标签中的“英语/英文4级/CET”等不触发。

    【去重与联系规则】
    - 同一候选人、同一岗位，最近15天本人或同事沟通过则跳过。
    - BOSS日期不清楚时，用飞书候选人台账兜底。
    - 只有满足全部条件并获得当轮明确授权，才自动打招呼和发送后续介绍。
    - 每累计10名已打招呼人选批量发送后续话术；任务结束不足10名也补发。
    - 不读取历史聊天内容，不自动点“不合适”。

    【主播固定后续话术】
    1. 您好，我们正在招聘主播。播品为3C保护壳类。店铺排名前三！主播抖音平台！纯付费！有成熟的主播晋升运营的机制！直播间日销700单左右，客单价150元。数据超级好！
    2. 月休6天！直播间盈利稳定，每月稳定高提成。入职上社保。无责底薪10k左右+最高提GMV3%提成，月均主播提成2000-1w。每周1次下午茶活动，节假日福利多多，团队氛围超级棒！方便发下简历和切片，给您介绍下我们岗位吗？

  # 完整简历分析：求职状态仅从在线简历截图读取，不在卡片阶段判断。
  resume_analysis:
    employment_status_whitelist: ["离职-随时到岗"]

  # 卡片预筛：在下载完整在线简历之前执行，只做卡片可见硬条件判断。
  # 不通过或字段缺失的候选人不会被点开完整简历，会写入 card_prescreen_rejected.json 审计。# 卡片预筛：只做硬条件判断，不做评分。全部条件满足才通过，否则不放行。
  card_prescreen:
    require_work_experience: true
    enabled: true
    active_status_keywords:
      - 刚刚活跃
      - 在线
    max_age: 30
    min_degree: 高中
    city_keyword: 深圳
    role_keyword: 主播
    
    salary_low_max: 13000
    salary_accept_negotiable: true

  # BOSS 推荐页右上角筛选面板配置（每次切换岗位后自动应用）
  # 不配置时默认：近14天没有看过 + 刚刚活跃
  boss_filter:
    not_viewed_14d: true
    gender: 女
    active_status:
      - 刚刚活跃
      - 在线

  # 每天最多真实发送多少条 BOSS 招呼。建议新账号先设置为 5-20。
  # 测试阶段设为 0（不限制），上线后改回 20。
  daily_send_limit: 0

  # 每天最多抓取/评估多少个候选人，避免短时间大量浏览触发风控。
  # 测试阶段设为 0（不限制），上线后改回 100。
  daily_candidate_limit: 0

  # 工作时间窗口。enabled=true 时，非工作时间会阻止自动打招呼。
  # 测试阶段关闭，上线后改回 enabled: true。
  work_time:
    enabled: false
    start: "09:00"
    end: "24:00"

  # BOSS 风控策略。遇到验证码、登录失效、页面异常时建议立刻停止。
  risk_control:
    # 每次关键操作之间的随机等待秒数，数值越大越像人工操作，但整体会更慢。
    random_wait_seconds:
      min: 5
      max: 10
    # true 表示检测到对应异常后停止流程，降低账号风险。
    stop_on:
      captcha: true
      login_expired: true
      page_exception: true
