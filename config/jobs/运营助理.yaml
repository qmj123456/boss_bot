recruitment:
  # 招聘岗位：运营助理（27届应届生方向）
  job_name: "运营助理"
  # 打招呼后发送的后续话术（优先级高于 config/message.yaml）
  greet_message: |
    哈喽，我们在招国内电商运营助理，接受实习生。
    产品为高客单价手机壳。公司主要在京东、天猫和抖音深耕，各店铺均排名在同类目前三！盈利状况很好！主打精细化运营！有成熟的运营线晋升机制！
    店长一对一带教！可以转正！可以开三方协议和实习证明！
    前期不需要轮岗，运营助理期间就能负责店铺运营工作！不是干杂活！
    大小周，工作时间九点-六点半，午休一个半小时。底薪在5-7k。
    这个是岗位情况，若感兴趣可以发下简历~
  boss_display_name: ${BOSS_JOB_NAME_OPERATION_ASSISTANT}
  boss_match_names:
    - "国内电商运营助理（接受27届/可转正）"

  experience_required: "必须是27届应届生（2027年毕业），education 中最近一段教育的 end 日期年份为2027；非27届直接淘汰。至少1段实习经历。近两份工作经历中，至少有一段工作经历具备至少2项数据成果。数字仅代表量词（名量词、动量词、产出量词）、日期、0-1或金额的，不算数据成果。"

  degree_required: "学历只收本科：第一学历须为本科；最高学历为硕士或博士的直接淘汰。"

  skill_requirements:
    - 必须是27届应届生（education 最近一段 end 年份为2027），非27届直接淘汰
    - 至少1段实习经历
    - 近两份工作经历中，至少有一段工作经历具备至少2项数据成果
    - 数字仅代表量词（名量词、动量词、产出量词）、日期、0-1或金额的，不算数据成果
    - 公办本科及以上（只看第一学历）

  # 卡片阶段按 geekEdus[0].major 判断：属于「理学学士」或「工学学士」专业
  # 目录即通过（目录维护在 boss_hr/domain/card_prescreen.py）。
  # 已通过的真实案例参考：
  #   - 软件工程 → 计算机类（工学）✓
  #   - 大数据管理与应用 → 统计学类（历史特例）✓
  #   - 统计学 → 统计学类（理学）✓

  additional_requirements: |
    【卡片预筛】
    - 最近一段教育经历的专业必须属于理学学士或工学学士专业；专业缺失或无法明确归类时，不进入在线简历分析。

    【27届硬筛（完整简历阶段）】
    - 候选人完整简历的 education 中最近一段教育的 end 日期年份必须为2027，否则直接淘汰，不招呼。
    - 27届判断依据：education[0].end 字段包含 "2027"。

    【完整简历必须全部满足】
    - 至少1段实习经历。
    - 近两份工作经历中，至少有一段工作经历具备至少2项数据成果。
    - 数字仅代表量词（名量词、动量词、产出量词）、日期、0-1或金额的，不算数据成果。

    【去重、执行与停止】
    - 卡片通过后立即查看完整简历；完整简历通过并完成去重后立即打招呼。
    - 若目标未完成，需要累计检查至少500名不重复候选人才能正常结束。
    - 遇到验证码、登录失效、额度、风控或平台确实没有更多候选人，须异常停止并明确汇报。
    - 只有获得当轮明确授权才能联系候选人；绝不自动点“不合适”。

  # 卡片预筛：只做硬条件判断，不做评分。全部条件满足才通过，否则不放行。
  # 完整简历分析：运营助理不限制求职状态。
  resume_analysis:
    recent_outcomes:
      limit: 2
      min_experiences: 1
      min_metrics: 2
      mode: any
      exclude_quantity_only: true
      distinct_metrics: false
      exclude_money: true
    employment_status_whitelist: []

  # 27届判断由 BOSS 筛选面板的"27年毕业"选项处理，不在卡片预筛重复
  # 专业判断改在卡片阶段执行，读取 geekEdus[0].major。
  card_prescreen:
    require_work_experience: true
    enabled: true
    active_status_keywords: ["刚刚活跃", "在线", "今日活跃"]
    max_age: 30
    # 只收本科（硕士/博士不放行）；面板保持“公办本科”不动。
    degree_exact: 本科
    # 例外：任意一段工作经历是国内外电商平台运营 → 不判专业（文科、管理学都可以）。
    # 学历仍然严格：只收本科，硕士/博士即使有电商经历也一律淘汰。
    stem_exempt_position_keywords: ["电商运营", "天猫", "京东", "亚马逊", "淘宝", "拼多多", "独立站"]
    stem_exempt_work_limit: 0
    city_keyword: 深圳
    # 宽口径：不限制具体岗位，期望/最近关注命中任一即通过。
    role_keywords: ["运营", "电商", "新媒体", "直播", "数据", "用户"]
    require_stem_major: true

  # BOSS 推荐页右上角筛选面板配置（每次切换岗位后自动应用）
  boss_filter:
    not_viewed_14d: true
    active_status:
      - 刚刚活跃
      - 在线
    graduation_year: 2027
    school_type: 公办本科
