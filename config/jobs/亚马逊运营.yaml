recruitment:
  job_name: "亚马逊运营"
  greet_message: |
    哈喽，我们在招亚马逊运营！
    公司重点项目为亚马逊！资金充足！年gmv过亿！
    品类不限，给你充分的自主空间！
    纯白帽！精品运营！客单价30-90美金！管理10条左右链接！
    无责底薪+提成（回款1-5%）+年终奖
    岗位优势：
    1、有成熟的合伙人晋升机制；
    2、成熟的产品开发团队，能充分支持选品决策，稳定的供应链，重视产品质量。
    3、强大的视觉团队，团队成员都是从视觉大厂出来的；
    4、高竞争力的薪酬制度，店铺月度销售额100W，岗位年收入在30~50W
    5、这里赋予你最大的运营权限，充分信任你的能力，让你自由掌控策略，发挥无限潜力！
    6、团队氛围活跃简单，互相分享学习是常态！
    7、全开放AI资源，不限token！
    方便发份简历详细聊下吗
  boss_display_name: ${BOSS_JOB_NAME_AMAZON_OPERATION}
  boss_match_names:
    - "亚马逊运营"

  # 学历只由 BOSS 筛选面板把关：院校类型「公办本科」+「只看第一学历」。
  # 完整简历阶段不再由 AI 判断学历，所以不配置 degree_required。
  experience_required: "先从岗位名称或该段工作内容包含亚马逊、Amazon、fba（忽略大小写）的经历中，选择在职周期最长的一段；该段须满8个月，才进入后续判断。无匹配经历或时长不足、无法确认均不通过。后续所有条件须在该同一段经历满足。"

  skill_requirements:
    - 先从岗位名称或该段工作内容包含亚马逊、Amazon、fba（忽略大小写）的经历中，选择在职周期最长的一段；该段须满8个月，才进入后续判断。无匹配经历或时长不足、无法确认均不通过。
    - 该段工作内容必须包含北美、美国、加拿大、墨西哥、美元、美金、$ 至少一个市场/计价信号
    - 该段工作内容必须至少有2种不同的指定指标带数字成果：GMV、GSV、ROI、销售额、成交额、月销、日销、订单量、转化率、ACOS、销量、毛利率、利润率、排名

  additional_requirements: |
    【卡片预筛】
    - 最近两份工作经历中，至少一份岗位名称包含“亚马逊”或“跨境”，且该同一段经历在职不少于8个月；不得用其他岗位的时长补足。

    【完整简历必须全部满足】
    1. 先从岗位名称或该段工作内容包含亚马逊、Amazon、fba（忽略大小写）的经历中，选择在职周期最长的一段；该段须满8个月，才进入后续判断。无匹配经历或时长不足、无法确认均不通过。
    2. 该段工作内容必须明确包含以下至少一个市场/计价信号：北美、美国、加拿大、墨西哥、美元、美金、$。若该段明确标注日本站/欧洲站/英国站等非北美站点，即使带货币金额也不通过；同时出现北美地理词与非北美站点时，以北美为准。
    3. 该段工作内容必须至少有2种不同指标带明确数字成果。有效指标仅限：GMV、GSV、ROI、销售额、成交额、月销、日销、订单量、转化率、ACOS、销量、毛利率、利润率、排名。
    4. 仅出现指标名称而没有数字不算；工作时长、团队人数、SKU数量等不在上述清单中的数字不算。

    【平台与市场兜底（仅这两项）】
    - 若其余条件均已满足，只是工作经历里找不到平台关键词（亚马逊/Amazon/fba）或市场信号，可结合最近两份工作经历与简历顶部“自我介绍/个人优势”部分综合判断；在其中找到即视为该项满足。
    - 该兜底只适用于平台关键词与市场信号两项。在职时长（8个月）、数据成果、求职状态等条件仍按原口径核验，不得扩大判断范围。

    【去重、执行与停止】
    - 卡片通过后才查看完整简历；卡片信息缺失时标记“待确认”，不打开完整简历。
    - 完整简历通过并完成去重后才允许打招呼。
    - 只有获得当轮明确授权才能联系候选人；绝不自动点“不合适”。

  resume_analysis:
    platform_experience:
      keywords:
      - 亚马逊
      - Amazon
      - fba
      min_months: 8
      select: longest
      regions:
      - 北美
      - 美国
      - 加拿大
      - 墨西哥
      - 美元
      - 美金
      - "$"
      # 市场信号允许出现在该段正文里，而不只看 region 字段
      market_match_in_content: true
      # C 方案：北美地理词命中即通过；只有货币信号时可通过，
      # 但同一段明确标注日本站/欧洲站等非北美市场则否决。
      market_geo_keywords:
      - 北美
      - 美国
      - 加拿大
      - 墨西哥
      market_veto_keywords:
      - 日本
      - 欧洲
      - 英国
      - 德国
      - 法国
      - 意大利
      - 西班牙
      - 荷兰
      - 澳洲
      - 澳大利亚
      - 中东
      - 阿联酋
      - 沙特
      - 印度
      - 新加坡
      - 东南亚
      - 韩国
      - 俄罗斯
      - 巴西
      # 平台词/市场信号可兜底到「近两份工作经历 + 自我介绍」，仅限这两项
      fallback:
        self_intro: true
        recent_works: 2
        allow_missing_platform: true
        allow_missing_region: true
    employment_status_whitelist: ["离职-随时到岗"]

  card_prescreen:
    require_work_experience: true
    enabled: true
    active_status_keywords: ["刚刚活跃", "在线"]
    max_age: null
    city_keyword: 深圳
    role_keywords: ["跨境电商运营", "亚马逊运营"]
    latest_work_end_not_before: "2026.09"
    recent_work_limit: 2
    # 近两份卡片工作经历中，岗位名称含“亚马逊”或“跨境”的同一段须满8个月。
    recent_work_position_keywords: ["亚马逊", "跨境"]
    recent_work_min_months: 8

  boss_filter:
    not_viewed_14d: true
    active_status:
      - 刚刚活跃
      - 在线
    employment_status:
      - 离职-随时到岗
    experience_years:
      - 1年以内
      - 1-3年
    # 不再单独勾「本科」：学历由院校类型「公办本科」+「只看第一学历」把关
    school_type: 公办本科
    first_degree_only: true
