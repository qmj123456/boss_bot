job_profile:
  # 岗位模板：运营助理（前期需要在中控岗位轮岗）。
  job_name: "运营助理（前期需要在中控岗位轮岗）"
  # 打招呼后发送的后续话术（优先级高于 config/message.yaml）
  greet_message: |
    您好，我们正在招聘运营助理（前期需要在中控岗位轮岗，后续转运营助理）。
    播品为3C保护壳类，店铺排名前三，抖音平台纯付费投流。
    有成熟的带教机制和明确的晋升通道。
    方便发下您的简历，给您详细介绍下岗位吗？
  boss_display_name: ${BOSS_JOB_NAME_OPERATION_ASSISTANT_ROTATION}
  boss_match_names: []
  experience_required: "接受前期在直播中控岗位轮岗，后续转运营助理；有直播间中控、场控、运营助理或电商后台经验优先。"
  degree_required: "大专及以上优先，可根据经验放宽。"
  skill_requirements:
    - 能接受前期中控轮岗，熟悉直播间节奏和商品链路
    - 能配合主播、运营完成上下架、改价、库存、优惠券和数据记录
    - 有直播间中控、场控、助播或电商运营助理经验优先
    - 细心、抗压、执行力强，愿意往运营方向发展
  additional_requirements: |
    【完整简历必须全部满足】
    - 简历需能体现"接受前期中控轮岗、后续转运营助理"的意愿或可塑性；明确表态"只想做纯运营、不愿中控轮岗"者按不通过。
    - 有直播间中控、场控、运营助理或电商后台经验优先；纯主播、纯剪辑拍摄、纯商务BD不通过。
    - 必须能配合主播、运营完成上下架、改价、库存、优惠券和数据记录。

    【有效成果口径】
    - 最近两份工作经历中，至少有一段同一工作经历具备至少2项不同的数据成果；不得跨经历相加，同一指标重复描述只计1项。
    - 有效成果包括带具体数字的转化率、ROI、营收金额、利润金额、降本金额、效率提升比例等业务结果。
    - 数字只代表量词（所有名量词、动量词、产出量词）、日期、工作时长或0-1的描述均不算数据成果；例如3条视频、100篇文章、20场直播、50个SKU、10次活动、管理5人、2026年、0-1起号均无效。

    【不算有效成果】
    - 数字只代表量词（所有名量词、动量词、产出量词）、日期、工作时长或0-1的描述均不算数据成果；例如3条视频、100篇文章、20场直播、50个SKU、10次活动、管理5人、2026年、0-1起号均无效。

    【直接排除项】
    - "最近一份工作"指简历中时间最近的一段工作经历；排除项只在最近一份工作的主营业务上判断。
    - "涉及 X"指最近一份工作的主营品类/平台/模式为 X，不是简历全文出现 X 这个词。
    - 最近一份工作为纯主播、纯剪辑拍摄、纯商务BD、纯招商（无中控或运营助理经验）。
    - 最近一份工作的主营业务为随身WIFI、笔记本电脑、平板、台式电脑、监控、汽车或手机主销；手机壳不排除。

    【待后续细化】
    - 需要明确轮岗周期、班次、转岗标准。
    - 需要明确是否接受只想做纯运营、不愿中控轮岗的人。
    - 需要补充直播间平台、品类和薪资结构。
  # 完整简历分析：求职状态仅从在线简历截图读取，不在卡片阶段判断。
  resume_analysis:
    recent_outcomes:
      limit: 2
      min_experiences: 1
      min_metrics: 2
      mode: any
      exclude_quantity_only: true
    employment_status_whitelist: ["离职-随时到岗"]

  # 卡片预筛：只做卡片可见硬条件判断，不做评分。
  card_prescreen:
    require_work_experience: true
    enabled: true
    active_status_keywords: ["刚刚活跃", "在线"]
    max_age: 30
    min_degree: 大专
    city_keyword: 深圳
    role_keywords: ["运营助理", "中控", "场控", "直播助理"]
