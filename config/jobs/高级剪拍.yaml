recruitment:
  # 招聘岗位：短视频拍剪师（高级）
  job_name: "高级剪拍"
  # 打招呼后发送的后续话术（优先级高于 config/message.yaml）
  greet_message: |
    哈喽，我们招聘拍摄剪辑（抖音信息流方向）
    我们是甲方公司。自营产品高客单价3C保护壳类。店铺抖音排名前三！日销600单！目前月均消耗100w+！盈利情况非常好！
    工作内容：脚本、拍摄、剪辑 对消耗负责。
    不做长期高度重复的内容！素材内容多样不限制！AI工具免费畅用！
    工作内容为内容创作、剪辑成片、数据复盘全流程帮助你建立内容判断能力！
    底薪+提成的薪资结构，提成高于行业水平的同时底薪能满足您的期望。
    大小周、入职上社保~节假日福利多多，团队氛围超级棒
    方便发下简历给您介绍下岗位吗？
  boss_display_name: ${BOSS_JOB_NAME_SENIOR_SHOOT_EDIT}
  boss_match_names:
    - "短视频拍剪师（3C/成熟账号/配置齐全）"

  experience_required: "最近3份工作中至少一段连续满8个月。最近两份工作经历中至少一段具备至少1项有效数据成果（量词/产出数量/日期/0-1不算，金额和消耗算）。近3年内若公司命中竞品名单、岗位名称命中剪拍/剪辑/拍摄/摄像/编导/内容相关词、在职满8个月，可允许该段经历没有数据。竞品公司经历命中排除项且无例外内容则淘汰。"

  degree_required: "学历暂不硬筛，作品、审美和执行效率优先。"

  skill_requirements:
    - 最近3份工作中至少一段连续满8个月
    - 最近两份工作经历中，至少有一段工作经历具备至少1项有效数据成果
    - 数字仅代表量词（名量词、动量词、产出量词）、日期或0-1的，不算数据成果；金额、消耗算有效数据成果
    - 近3年内公司命中竞品名单、岗位名称命中剪拍/剪辑/拍摄/摄像/编导/内容相关词、在职满8个月的经历，可豁免数据成果要求
    - 简历需体现抖音/千川短视频或信息流场景经验
    - 排除规则（仅针对竞品公司经历，命中任一即淘汰，除非同一段命中例外条款）：
      - 纯广告/TVC方向：该段经历仅提及 TVC、品牌广告、宣传片拍摄制作，未涉及抖音/千川短视频
      - 纯电商主图拍摄：该段经历仅为天猫、京东等平台拍摄商品主图、详情页视频
      - 纯摄影师：该段经历岗位内容仅为拍摄（掌机/布光/构图），不参与脚本撰写或后期剪辑
      - 纯广告编导：该段经历仅负责广告片/品牌片编导，不参与剪辑，且无抖音/千川经验

  additional_requirements: |
    【完整简历必须全部满足】
    - 最近3份工作中至少一段连续满8个月。
    - 最近两份工作经历中，至少有一段工作经历具备至少1项有效数据成果（量词、产出数量、日期、0-1不算；金额、消耗算）。
    - 竞品豁免：近3年内公司命中竞品名单、岗位名称命中剪拍/剪辑/拍摄/摄像/编导/内容相关词、在职满8个月，可允许该段经历没有数据成果。

    【有效成果口径】
    - 候选人简历中只要出现带数字的 GMV、GSV、ROI、销售额、成交额、月销、日销、订单量、转化率或消耗，即视为有效成果。
    - "业绩X万-X万"、"月消耗100w+"、"日耗5000+"、"单条素材跑量20w+"等带数字描述均属于有效成果。
    - 剪辑素材带动的带货 GMV、销售额（如"剪辑的素材带来 GMV 10w+"）属于有效成果。
    - 爆款视频带数字（如"播放量100w+"、"点赞10w+"）属于有效成果。

    【不算有效成果】
    - 工作时长、在职月数、剪辑软件熟练度自评。
    - 静态粉丝量、视频点赞量（无转化或消耗数据时）。
    - 在职期间"参与制作"无明确产出数字。

    【排除规则（只针对竞品公司经历）】
    - 本规则只在简历中「竞品公司」的那段工作经历内判断；非竞品公司的经历不套用本规则。
    - 竞品公司那段经历的工作内容命中以下任一即淘汰，除非同一段同时命中【例外条款】：
      - 纯广告/TVC方向：该段经历仅提及 TVC、品牌广告、宣传片拍摄制作，未涉及抖音/千川短视频。
      - 纯电商主图拍摄：该段经历仅为天猫、京东等平台拍摄商品主图、详情页视频。
      - 纯摄影师：该段经历岗位内容仅为拍摄（掌机/布光/构图），不参与脚本撰写或后期剪辑。
      - 纯广告编导：该段经历仅负责广告片/品牌片编导，不参与剪辑，且无抖音/千川经验。

    【例外条款（只针对竞品公司经历）】
    - 例外条款只作用于竞品公司的那段经历：同一段经历里同时出现排除项描述和例外内容时，按例外条款放行，不淘汰。
    - 例外内容指明确提及千川、抖音短视频或信息流。
    - 非竞品公司的经历不适用本排除/例外判断。

    【去重、执行与停止】
    - 卡片通过后立即查看完整简历；完整简历通过并完成去重后立即打招呼。
    - 若目标未完成，需要累计检查至少500名不重复候选人才能正常结束。
    - 遇到验证码、登录失效、额度、风控或平台确实没有更多候选人，须异常停止并明确汇报。
    - 只有获得当轮明确授权才能联系候选人；绝不自动点“不合适”。

  # 完整简历分析：求职状态白名单 + 通用成果要求；竞品段可豁免数据。
  resume_analysis:
    employment_status_whitelist: ["离职-随时到岗"]
    recent_outcomes:
      limit: 2
      min_experiences: 1
      min_metrics: 1
      mode: any
      exclude_quantity_only: true
      distinct_metrics: false
    # 竞品名单复用 card_prescreen.competitor_companies。
    competitor_exemption:
      min_months: 8
      recent_years: 3
      position_keywords: ["剪拍", "拍剪", "拍摄剪辑", "视频剪辑", "短视频剪辑", "剪辑", "摄影", "摄像", "编导", "导演", "内容"]

  # 卡片预筛：只做卡片可见硬条件判断，不做评分。
  card_prescreen:
    require_work_experience: true
    enabled: true
    active_status_keywords: ["刚刚活跃", "在线"]
    max_age: 32
    city_keyword: 深圳
    # 最近一份工作结束时间 >= 2026.08，或明确写“至今”。
    latest_work_end_not_before: "2026.08"
    # 期望薪资下限 >= 9K（面议放行，交给简历阶段）。
    salary_low_min: 9000
    role_keywords: ["剪辑", "新媒体运营", "内容运营", "编导", "拍剪"]
    # 最近一份工作经历岗位包含以下任一即可进入简历阶段
    recent_work_limit: 1
    recent_work_position_keywords: ["剪辑", "运营", "编导", "拍剪", "内容", "摄影"]
    # 竞品名单只用于简历阶段「豁免数据」，卡片阶段不再把竞品当淘汰条件。
    competitor_card_check: false
    # 竞品公司卡片预筛（competitor_card_check=false 时不生效）：geekWorks 中同一段经历需同时满足：
    # company 命中其一、岗位名命中剪拍/剪辑/拍摄/摄像/编导相关关键词、
    # 近3年内、工作月数≥8个月
    competitor_position_keywords: ["剪拍", "拍剪", "拍摄剪辑", "视频剪辑", "短视频剪辑", "剪辑", "摄影", "摄像", "编导", "导演"]
    competitor_recent_years: 3
    competitor_min_months: 8
    competitor_companies:
