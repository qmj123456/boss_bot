recruitment:
  # 招聘岗位名称，会进入 AI 硬性条件判断输入，也会写入数据库和飞书表格。
  job_name: "兼职主播"
  # 打招呼后发送的后续话术（优先级高于 config/message.yaml）
  greet_message: |
    哈喽，我们正在招兼职主播
    播抖音，品类为高客单价手机壳，店铺排名前三！
    纯付费有中控配合，好播！！
    兼职时间灵活可谈！可以稳定排班，一天最高可以排4-5h！
    时间：早上8点-凌晨1点
    薪资半月结！薪资半月结！
    时薪：100-150
  boss_display_name: ${BOSS_JOB_NAME_PARTTIME_ANCHOR}
  boss_match_names: 
    - "兼职主播（抖音）"

  experience_required: "最近实际岗位必须包含主播、带货主播、抖音主播或电商主播。纯运营、短视频、销售、商务BD、客服、场控、中控、助播、运营助理不通过。不强制要求期望岗位字段包含'兼职'。"

  degree_required: "高中及以上。"

  skill_requirements:
    - 最近实际岗位包含主播、带货主播、抖音主播或电商主播
    - 纯运营、短视频、销售、商务BD、客服、场控、中控、助播、运营助理不通过

  additional_requirements: |
    【完整简历必须全部满足】
    - 最近实际岗位必须包含主播、带货主播、抖音主播或电商主播。
    - 纯运营、短视频、销售、商务BD、客服、场控、中控、助播、运营助理不通过。

    【直接排除】
    - “最近一份工作”指简历中时间最近的一段工作经历；排除项只在最近一份工作的主营业务/主营品类上判断，历史经历或过往项目中提到这些品类不算命中。
    - “涉及 X”指最近一份工作的主营品类/平台/模式为 X，不是简历全文出现 X 这个词。
    - 例：最近一份工作是带货主播主营服装，即使更早经历提过“曾帮朋友卖过平板”，不命中“最近一份工作涉及平板”的排除项。
    - 最近一份工作的主营业务为随身WIFI、笔记本电脑、平板、台式电脑、监控、汽车或手机主销；手机壳不排除。
    - 最近一份工作的主营业务为留资、旅游线路、旅游套餐、旅游团购、本地生活、娱乐主播、才艺值或团购。
    - 最近7个月明确在小红书、TikTok、京东、淘宝、天猫、得物、视频号、快手、唯品会等平替平台做直播/带货经历；普通运营协作、内容发布或泛泛写平台完成工作不自动触发。
    - 最近两份工作职责/业绩描述出现中文词“英文”或“美金”；证书、语言能力、技能标签中的“英语/英文4级/CET”等不触发。

    【去重与打招呼】
    - Boss日期不清楚时，用飞书候选人台账兜底。
    - 只有满足全部条件并获得当轮明确授权，才自动打招呼和发送后续介绍。
    - 不读取历史聊天内容，不自动点“不合适”。

  # 完整简历分析：求职状态仅从在线简历截图读取，不在卡片阶段判断。
  resume_analysis:
    employment_status_whitelist: ["离职-随时到岗"]

  # 卡片预筛：只做卡片可见硬条件判断，不做评分。
  card_prescreen:
    require_work_experience: true
    enabled: true
    active_status_keywords: ["刚刚活跃", "在线"]
    max_age: 30
    min_degree: 高中
    city_keyword: 深圳
    role_keyword: 主播
    require_city_and_role_in_same_field: true

  # BOSS 推荐页右上角筛选面板配置（每次切换岗位后自动应用）
  boss_filter:
    not_viewed_14d: true
    gender: 女
    active_status:
      - 刚刚活跃
      - 在线
